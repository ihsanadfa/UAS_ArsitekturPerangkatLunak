# ===================================================================
# Spring Boot Configuration for University Canteen Ordering System
# Design Patterns Implementation: Singleton, Decorator, Factory
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.error.whitelabel.enabled=false

# Application Info
spring.application.name=University Canteen Ordering System
info.app.name=@spring.application.name@
info.app.description=Final Exam Project implementing Design Patterns
info.app.version=1.0.0
info.app.author=Student UAS APL

# H2 Database Configuration (In-Memory for Development)
spring.datasource.url=jdbc:h2:mem:canteen_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (for development/testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# JPA/Hibernate Configuration - FIXED FOR TABLE CREATION ORDER
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.format-sql=true

# CRITICAL: Ensure tables are created BEFORE data.sql runs
spring.jpa.defer-datasource-initialization=true
# Temporarily disable data.sql to allow application to start
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data.sql
# spring.sql.init.continue-on-error=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Jackson Configuration for JSON
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=NON_NULL

# Logging Configuration
logging.level.com.university.canteen=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Development Settings
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Pattern-specific Configuration
app.patterns.singleton.thread-safe=true
app.patterns.decorator.max-decorators=3
app.patterns.factory.payment-types=TUNAI,TRANSFER,QRIS

# Business Logic Configuration
app.business.max-cart-items=10
app.business.max-quantity-per-item=5
app.business.decorator-prices.sambal=2000
app.business.decorator-prices.kemasan=3000
app.business.decorator-prices.prioritas=5000

# Demo Data Configuration
app.demo.auto-populate=true
app.demo.sample-menus=10
app.demo.sample-orders=5